; LED frame control. Pinned versions: do NOT change without testing on hardware.
; Platform 6.x = Arduino-ESP32 core 2.0.x (code uses the 2.x LEDC API: ledcSetup/ledcAttachPin).

[platformio]
default_envs = node

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -Wall

; Wall node: 30-pin ESP-WROOM-32 (CH340 USB)
[env:node]
board = esp32dev
build_src_filter = +<node/>

; Control center: same 30-pin board. Wi-Fi AP + web server (serves web/control.html) + USB JSON-line + ESP-NOW bridge.
[env:control]
board = esp32dev
build_src_filter = +<control/>
extra_scripts = pre:tools/embed_web.py
lib_deps =
  bblanchon/ArduinoJson@7.0.4
  links2004/WebSockets@2.4.1

; FULL CAPABILITY NODE TEST: the production node source + LF_FULLTEST instrumentation (src/node/fulltest.h). Driven by tools/fulltest.py.
[env:node_fulltest]
extends = env:node
build_flags = ${env:node.build_flags} -DLF_FULLTEST
monitor_speed = 460800

; Bench test: GPIO16 breathing LED, BOOT button starts/stops it. For checking one MOSFET board + strip.
[env:mosfet_test]
board = esp32dev
build_src_filter = +<mosfet_test/>
