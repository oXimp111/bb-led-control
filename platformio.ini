; LED frame control. Pinned versions: do NOT change without testing on hardware.
; Platform 6.x = Arduino-ESP32 core 2.0.x (code uses the 2.x LEDC API: ledcSetup/ledcAttachPin).

[platformio]
default_envs = node

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -Wall

; Wall node: 30-pin ESP-WROOM-32 (CH340 USB)
[env:node]
board = esp32dev
build_src_filter = +<node/>
